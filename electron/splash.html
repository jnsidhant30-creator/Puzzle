<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:;" />
    <title>PuzzleVerse</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        background: #142331;
        color: #F5F7F8;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
        border: 1px solid #36515F;
        border-radius: 14px;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 14px;
        padding: 28px;
      }
      .title {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #F5F7F8;
      }
      .tagline {
        font-size: 13px;
        font-weight: 600;
        color: #A8E5D5;
      }
      .bar-track {
        width: 220px;
        height: 6px;
        border-radius: 999px;
        background: #1C2D3B;
        border: 1px solid #36515F;
        overflow: hidden;
        margin-top: 6px;
      }
      .bar-fill {
        width: 45%;
        height: 100%;
        background: #38C6BA;
        border-radius: 999px;
        animation: slide 1.15s ease-in-out infinite;
      }
      .ver {
        font-size: 11px;
        color: #98AAB8;
        margin-top: 2px;
      }
      @keyframes slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg width="72" height="72" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#1C2D3B" />
        <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="#38C6BA" stroke-width="2" />
        <path d="M18 22H26C26 19.2 28.2 17 31 17C33.8 17 36 19.2 36 22H44C45.7 22 47 23.3 47 25V33C49.8 33 52 35.2 52 38C52 40.8 49.8 43 47 43V47C47 48.7 45.7 50 44 50H18C16.3 50 15 48.7 15 47V25C15 23.3 16.3 22 18 22Z" fill="#38C6BA" />
        <rect x="21" y="29" width="8" height="8" rx="2" fill="#F5F2E9" />
        <rect x="33" y="29" width="8" height="8" rx="2" fill="#142331" />
        <rect x="21" y="40" width="8" height="5" rx="1.5" fill="#A8E5D5" />
      </svg>
      <div>
        <div class="title">PuzzleVerse</div>
        <div class="tagline">Challenge Your Mind. Beat Your Best.</div>
      </div>
      <div class="bar-track" aria-hidden="true">
        <div class="bar-fill"></div>
      </div>
      <div class="ver">Loading desktop arcade...</div>
    </div>
  </body>
</html>
